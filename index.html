<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Seat at the Table — LIN 553</title>
<style>
  :root{
    --red:#CB2026;
    --red-dark:#8f1519;
    --black:#1a1512;
    --cream:#F6F0E6;
    --cream-deep:#EDE3D2;
    --line: rgba(26,21,18,0.14);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--black);font-family:var(--sans);}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px;}
  .stage{width:100%;max-width:720px;padding:48px 28px;margin:0 auto;}
  ::selection{background:var(--red);color:var(--cream);}

  /* ---------- typography ---------- */
  h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--black);margin:0 0 0.4em;}
  h1{font-size:2.1rem;line-height:1.15;letter-spacing:-0.01em;}
  h2{font-size:1.5rem;line-height:1.25;color:var(--red-dark);}
  .eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:0.12em;font-size:0.72rem;
    color:var(--red);font-weight:600;margin-bottom:10px;}
  p{font-family:var(--serif);font-size:1.08rem;line-height:1.68;color:#2a231f;}
  .ui-text{font-family:var(--sans);}
  .fine{font-family:var(--sans);font-size:0.85rem;color:#5b5147;line-height:1.5;}

  /* ---------- scene shell ---------- */
  .scene{opacity:0;transform:translateY(10px);animation:fadeIn 0.55s ease forwards;}
  @keyframes fadeIn{to{opacity:1;transform:translateY(0);}}
  .card{background:var(--cream-deep);border:1px solid var(--line);border-radius:2px;padding:26px 26px;margin:20px 0;}
  .divider{height:1px;background:var(--line);margin:30px 0;}

  /* ---------- choices ---------- */
  .choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:3px;padding:18px 20px;margin:12px 0;cursor:pointer;transition:border-color .18s, background .18s;
    font-family:var(--serif);font-size:1rem;line-height:1.55;color:#2a231f;}
  .choice:hover{border-color:var(--red);background:#fffaf6;}
  .choice:focus-visible{outline:3px solid var(--red);outline-offset:2px;}
  .choice .tag{display:block;font-family:var(--sans);text-transform:uppercase;letter-spacing:0.08em;
    font-size:0.7rem;color:var(--red);font-weight:700;margin-bottom:8px;}

  /* ---------- buttons ---------- */
  .btn{font-family:var(--sans);font-weight:600;font-size:0.95rem;border:none;border-radius:3px;
    padding:13px 26px;cursor:pointer;transition:background .15s, transform .1s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-outline{background:transparent;color:var(--black);border:1.5px solid var(--black);}
  .btn-outline:hover{background:var(--black);color:var(--cream);}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}

  input[type=text], textarea{font-family:var(--sans);font-size:1rem;width:100%;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:3px;background:#fff;color:var(--black);}
  textarea{min-height:120px;resize:vertical;}
  label.field-label{display:block;font-family:var(--sans);font-weight:600;font-size:0.85rem;
    text-transform:uppercase;letter-spacing:0.06em;color:#5b5147;margin:18px 0 8px;}

  .radio-row{display:block;background:#fff;border:1px solid var(--line);border-radius:3px;
    padding:14px 16px;margin:8px 0;cursor:pointer;font-family:var(--sans);font-size:0.95rem;}
  .radio-row:hover{border-color:var(--red);}
  .radio-row input{margin-right:10px;}
  .radio-row .desc{display:block;font-size:0.82rem;color:#5b5147;margin-top:4px;margin-left:24px;}

  .progress{font-family:var(--sans);font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;
    color:#8a8074;margin-bottom:6px;}

  .caveat{font-family:var(--sans);font-size:0.85rem;background:#fff;border-left:3px solid var(--red);
    padding:14px 16px;margin:18px 0;color:#3a332c;}

  .hexwrap{display:flex;justify-content:center;margin:20px 0;}
  .hex-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-family:var(--sans);font-size:0.85rem;margin-top:10px;}
  .hex-legend span.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:8px;}

  .recap-item{font-family:var(--sans);font-size:0.92rem;padding:10px 0;border-bottom:1px solid var(--line);}
  .recap-item:last-child{border-bottom:none;}

  .exploration-banner{position:sticky;top:0;background:var(--black);color:var(--cream);
    font-family:var(--sans);font-size:0.82rem;text-align:center;padding:9px;z-index:10;letter-spacing:0.02em;}

  .name-title{font-family:var(--serif);font-size:2.6rem;color:var(--red);margin:0 0 6px;}

  @media print{
    body *{visibility:hidden;}
    #printSummary, #printSummary *{visibility:visible;}
    #printSummary{position:absolute;top:0;left:0;width:100%;padding:20px;}
    .exploration-banner, .btn-row{display:none !important;}
  }
</style>
</head>
<body>

<div id="explorationBanner" class="exploration-banner" style="display:none;">
  You're exploring a different path. Your original submission isn't affected.
</div>

<div class="stage" id="app"></div>

<!-- Hidden printable summary, populated by JS at export time -->
<div id="printSummary" style="display:none;"></div>

<script>
/* ============================================================
   A SEAT AT THE TABLE — branched leadership scenario
   LIN 553, Week 2 — Podsakoff six-dimension version
   ============================================================ */

const DIMENSIONS = [
  {key:'vision', label:'Vision', desc:'Identifying opportunities and painting a compelling picture of the future.'},
  {key:'example', label:'Leading by Example', desc:'Leading by doing, not just telling — modeling the behavior you want to see.'},
  {key:'group', label:'Fostering Group Goals', desc:'Building collaboration and a shared sense of "we" across the team.'},
  {key:'performance', label:'High Performance Expectations', desc:'Expecting — and insisting on — excellent work.'},
  {key:'support', label:'Individualized Support', desc:'Attending to people\u2019s personal feelings, needs, and circumstances.'},
  {key:'stimulation', label:'Intellectual Stimulation', desc:'Challenging people to question assumptions and try new ideas.'}
];

const MAXSCORES = {vision:6, example:4, group:7, performance:6, support:9, stimulation:4};

let state = {
  name:'',
  scores:{vision:0, example:0, group:0, performance:0, support:0, stimulation:0},
  sceneOnePath:null,
  choiceLog:[],
  predictBefore:null,
  predictAfter:'',
  ending:null,
  exploration:false,
  step:'title'
};

function resetForReplay(){
  state.scores = {vision:0, example:0, group:0, performance:0, support:0, stimulation:0};
  state.sceneOnePath = null;
  state.choiceLog = [];
  state.predictAfter = '';
  state.ending = null;
  state.exploration = true;
  document.getElementById('explorationBanner').style.display = 'block';
  goTo('scene1');
}

function addScore(obj){
  for(const k in obj){ state.scores[k] = (state.scores[k]||0) + obj[k]; }
}

function logChoice(scene, text, tagLine, consequence, costTag){
  state.choiceLog.push({scene, text, tagLine, consequence, costTag, reflection:''});
}

function showConsequence(text, nextStep){
  render(`
    <p class="eyebrow">What happened next</p>
    <div class="card"><p>${text}</p></div>
    <div class="btn-row"><button class="btn btn-primary" onclick="goTo('${nextStep}')">Continue</button></div>
  `);
}

function dimensionReferenceHTML(){
  return `<div class="card">
    <p class="eyebrow" style="margin-bottom:10px;">Quick reference &mdash; the six dimensions</p>
    ${DIMENSIONS.map(d=>`<p class="ui-text" style="margin:6px 0;"><strong>${d.label}:</strong> ${d.desc}</p>`).join('')}
  </div>`;
}

const app = document.getElementById('app');

function render(html){
  app.innerHTML = `<div class="scene">${html}</div>`;
  window.scrollTo({top:0, behavior:'smooth'});
}

function goTo(step){
  state.step = step;
  const fn = SCREENS[step];
  if(fn) fn();
}

/* ---------------- TITLE ---------------- */
function screenTitle(){
  render(`
    <p class="eyebrow">LIN 553 &middot; Week 2 Studio Deliverable</p>
    <h1 class="name-title">A Seat at the Table</h1>
    <p>You are Jordan Reyes, CEO and co-founder of Long Table Events &amp; Catering. In the next twenty minutes,
    a crisis is going to force a series of real leadership decisions &mdash; none of them clean.</p>
    <div class="card">
      <p class="fine">This scenario draws on real events in business history, reshaped and combined with other sources
      for educational use. Names, companies, and specific details have been changed or invented, and no scene should
      be read as a depiction of any actual person or organization.</p>
    </div>
    <label class="field-label" for="studentName">Your name (for your downloaded submission)</label>
    <input type="text" id="studentName" placeholder="Type your name">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitName()">Begin</button>
    </div>
  `);
}
function submitName(){
  const val = document.getElementById('studentName').value.trim();
  state.name = val || 'Student';
  goTo('predictBefore');
}

/* ---------------- PREDICT BEFORE ---------------- */
function screenPredictBefore(){
  const options = DIMENSIONS.map(d => `
    <label class="radio-row">
      <input type="radio" name="predictBefore" value="${d.key}">
      <strong>${d.label}</strong>
      <span class="desc">${d.desc}</span>
    </label>
  `).join('');
  render(`
    <p class="eyebrow">Before you begin</p>
    <h2>In general, which of these is your strongest?</h2>
    <p>Think about how you actually tend to lead \u2014 not the ideal version of yourself. There's no right answer here;
    you'll come back to this after the scenario.</p>
    ${options}
    <div class="btn-row"><button class="btn btn-primary" onclick="submitPredictBefore()">Continue</button></div>
  `);
}
function submitPredictBefore(){
  const sel = document.querySelector('input[name=predictBefore]:checked');
  if(!sel){ alert('Please select one option to continue.'); return; }
  state.predictBefore = sel.value;
  goTo('scene1');
}

/* ---------------- SCENE 1 ---------------- */
function screenScene1(){
  render(`
    <p class="progress">Scene 1 of 10</p>
    <h2>The Gut Punch</h2>
    <p>It takes eleven days. Every wedding, conference, and corporate gala on Long Table's calendar for the next four
    months cancels. Revenue drops by more than half almost overnight. Priya, your COO, sits across from you with
    the numbers open on her laptop and doesn't say anything at first. Someone has to tell the team. The question is how.</p>
    <button class="choice" onclick="chooseScene1('A')">
      <span class="tag">Option A</span>
      Call a company-wide meeting this week. Share the real numbers with everyone at once &mdash; not a softened
      version &mdash; and open the floor before you've decided anything, so the team is solving this with you
      from the start.
    </button>
    <button class="choice" onclick="chooseScene1('B')">
      <span class="tag">Option B</span>
      Work the numbers privately with Priya first. Protect the team from the scariest version of this until there's
      an actual plan to bring them &mdash; walking in with nothing but fear helps no one.
    </button>
  `);
}
function chooseScene1(opt){
  state.sceneOnePath = opt;
  let consequence;
  if(opt==='A'){
    addScore({group:2, vision:1});
    consequence = `The room is quiet for a beat, then someone asks a real question instead of leaving. By the end
      of the meeting, three people have already offered ideas you hadn't considered. It's uncomfortable, but the
      problem now belongs to more than just you and Priya.`;
    logChoice('Scene 1: The Gut Punch','Held a company-wide meeting and shared the real numbers immediately.','Fostering Group Goals, Vision', consequence, 'The room now expects that level of transparency going forward \u2014 a standard you have to keep meeting.');
  } else {
    addScore({support:2});
    consequence = `You and Priya spend a tense week modeling scenarios alone. When you finally present a plan,
      it's polished &mdash; but a few people quietly mention afterward that they wish they'd known sooner. Trust
      in the process, not in you personally, is quietly harder to build now.`;
    logChoice('Scene 1: The Gut Punch','Worked the numbers privately with Priya before telling the team.','Individualized Support', consequence, 'A few people needed to hear it from you directly, not the plan \u2014 that trust gap never fully closed.');
  }
  showConsequence(consequence, 'scene2');
}

/* ---------------- SCENE 2 ---------------- */
function screenScene2(){
  render(`
    <p class="progress">Scene 2 of 10</p>
    <h2>The Volunteer Question</h2>
    <p>Layoffs would fix the math fastest. You don't want to do that. The real question is how to avoid it.</p>
    <button class="choice" onclick="chooseScene2('A')">
      <span class="tag">Option A</span>
      Give everyone a private form: state, anonymously, what pay cut you could personally absorb for a few
      months, if any. No pressure, no visible ranking &mdash; just an honest ask.
    </button>
    <button class="choice" onclick="chooseScene2('B')">
      <span class="tag">Option B</span>
      Cut your own pay to almost nothing first, in public, then apply a seniority-based formula to everyone
      else. Decisive, and you're asking no more of anyone than you're asking of yourself.
    </button>
  `);
}
function chooseScene2(opt){
  let consequence;
  if(opt==='A'){
    addScore({group:2, support:1});
    consequence = `Ninety percent of the team turns in a form within 48 hours. Contributions are wildly uneven
      &mdash; some can give a lot, some almost nothing &mdash; but nobody feels singled out, and the total gets
      you most of the way to your number.`;
    logChoice('Scene 2: The Volunteer Question','Asked employees to privately volunteer what pay cut they could absorb.','Fostering Group Goals, Individualized Support', consequence, 'Some people gave far more than others could recognize, and no one ever said so out loud.');
  } else {
    addScore({example:2});
    consequence = `People respect the personal sacrifice &mdash; you hear that directly. But two people quietly
      tell Priya the seniority formula doesn't account for who actually has savings versus who doesn't; the math
      works, the fairness doesn't always feel like it does.`;
    logChoice('Scene 2: The Volunteer Question','Cut your own pay first, then applied a seniority-based formula for everyone.','Leading by Example', consequence, 'The seniority formula quietly didn\u2019t sit right with everyone it applied to.');
  }
  showConsequence(consequence, 'scene2b');
}

/* ---------------- SCENE 2b — NEW: The Double Shift (strengthens Leading by Example) ---------------- */
function screenScene2b(){
  render(`
    <p class="progress">Scene 3 of 10</p>
    <h2>The Double Shift</h2>
    <p>Half the kitchen crew is out the same week &mdash; sick, or covering for family. Someone has to fill the gap
    on the line, starting tonight.</p>
    <button class="choice" onclick="chooseScene2b('A')">
      <span class="tag">Option A</span>
      Work the line yourself, elbow to elbow with the remaining crew, for as long as it takes to get through it.
    </button>
    <button class="choice" onclick="chooseScene2b('B')">
      <span class="tag">Option B</span>
      Bring in a temp agency worker to cover the gap, and keep your own time on running the business from the top.
    </button>
  `);
}
function chooseScene2b(opt){
  let consequence;
  if(opt==='A'){
    addScore({example:2});
    consequence = `The crew doesn't say much about it in the moment, but two weeks later Ray mentions, almost
      offhand, that he's never seen an owner actually work a full line before. It costs you sleep and a strained
      back you're still complaining about in June.`;
    logChoice('Scene 2b: The Double Shift','Worked the line yourself alongside the remaining crew.','Leading by Example', consequence, 'Two exhausting weeks of unglamorous work that never showed up in any report.');
  } else {
    addScore({performance:2});
    consequence = `The temp gets the job done competently, and you're free to handle the fifteen other fires that
      week. But when you walk through the kitchen, you notice the regular crew doesn't quite treat the new
      person like one of their own &mdash; and neither, if you're honest, do you.`;
    logChoice('Scene 2b: The Double Shift','Brought in a temp worker and stayed focused on running the business.','High Performance Expectations', consequence, 'The kitchen crew never fully absorbed the temp as one of their own \u2014 and you didn\u2019t push it.');
  }
  showConsequence(consequence, 'scene3');
}

/* ---------------- SCENE 3 (branches on Scene 1) ---------------- */
function screenScene3(){
  const setup = state.sceneOnePath === 'A'
    ? `Marcus, your head chef of eleven years, comes to you directly and easily. The team already knows this is a
       shared problem, so raising a teammate's hardship doesn't feel like breaking ranks. "One of my people can't
       do this without missing rent," he says. "I think she'd tell you herself if she thought it was safe to."`
    : `Marcus, your head chef of eleven years, is visibly uncomfortable bringing this up. The team was told a plan,
       not asked for input, so surfacing a problem with it feels like undermining you. He hedges and downplays it
       at first, and you have to draw the real situation out of him: one of his kitchen staff, a single parent,
       can't absorb any cut without missing rent.`;
  render(`
    <p class="progress">Scene 4 of 10</p>
    <h2>The One Who Can't</h2>
    <p>${setup}</p>
    <button class="choice" onclick="chooseScene3('A')">
      <span class="tag">Option A</span>
      Quietly cover her cut from a small reserve fund. Tell no one else. It protects her, but it's a secret
      exception to a system everyone else believes is uniform.
    </button>
    <button class="choice" onclick="chooseScene3('B')">
      <span class="tag">Option B</span>
      Announce a company loan available to anyone who needs one. Consistent and transparent &mdash; but colder,
      and it means she has to ask for it herself.
    </button>
  `);
}
function chooseScene3(opt){
  let consequence;
  if(opt==='A'){
    addScore({support:2});
    consequence = `She keeps her rent paid and never has to say a word to anyone. Months later, a rumor starts
      that "someone" got special treatment &mdash; you never confirm or deny it, and it costs you a little
      credibility with the two or three people who suspect it's true.`;
    logChoice('Scene 3: The One Who Can\'t','Quietly covered her cut from a reserve fund, told no one.','Individualized Support', consequence, 'An unconfirmed rumor of favoritism outlived the actual decision.');
  } else {
    addScore({group:2});
    consequence = `The loan program gets used by four different people over the next two months, not just her
      &mdash; turns out she wasn't the only one struggling quietly. But she tells Marcus, months later, that
      having to formally ask for it was one of the harder parts of that whole stretch.`;
    logChoice('Scene 3: The One Who Can\'t','Announced a company loan available to anyone who needed one.','Fostering Group Goals', consequence, 'Asking for help stayed a visible, slightly exposing thing to do, for everyone who used it.');
  }
  showConsequence(consequence, 'scene4');
}

/* ---------------- SCENE 4 ---------------- */
function screenScene4(){
  render(`
    <p class="progress">Scene 5 of 10</p>
    <h2>The Bold Idea</h2>
    <p>Eight weeks in, still bleeding. Danae, an event coordinator two years into the job, corners you after a
    call. She wants to convert part of the kitchen into small-batch meal kits for locked-down families &mdash;
    untested, resource-intensive, and might fail outright.</p>
    <button class="choice" onclick="chooseScene4('A')">
      <span class="tag">Option A</span>
      Back it publicly. Give Danae real budget and authority to pilot it, even though it's risky and visible
      if it flops.
    </button>
    <button class="choice" onclick="chooseScene4('B')">
      <span class="tag">Option B</span>
      "Not now &mdash; let's stabilize the core business first." Protect focus and execution on what's already
      working.
    </button>
  `);
}
function chooseScene4(opt){
  let consequence;
  if(opt==='A'){
    addScore({stimulation:2, vision:1});
    consequence = `The first two weeks of the meal-kit pilot are rough &mdash; a batch gets thrown out, a delivery
      is late. But by week three it's covering real revenue, and Danae now walks into meetings differently:
      like someone whose judgment you trust.`;
    logChoice('Scene 4: The Bold Idea','Backed Danae\'s meal-kit pivot publicly with real budget and authority.','Intellectual Stimulation, Vision', consequence, 'Two genuinely rough weeks happened first \u2014 it could easily have gone the other way, and everyone knew it.');
  } else {
    addScore({performance:2});
    consequence = `The core business runs cleaner without the distraction. Danae doesn't bring you another new
      idea for the rest of the crisis &mdash; whether that's because she agreed with the call, or because she
      read it as "don't bother," you're honestly not sure.`;
    logChoice('Scene 4: The Bold Idea','Told Danae to wait \u2014 focus stayed on stabilizing the core business.','High Performance Expectations', consequence, 'New ideas got noticeably quieter after that \u2014 whether by agreement or by message received, you never found out.');
  }
  showConsequence(consequence, 'scene4b');
}

/* ---------------- SCENE 4b — NEW: The Question Nobody Asked (strengthens Intellectual Stimulation) ---------------- */
function screenScene4b(){
  render(`
    <p class="progress">Scene 6 of 10</p>
    <h2>The Question Nobody Asked</h2>
    <p>In a Tuesday huddle, Ray mentions almost as an aside that the delivery routing has been done the same way
    for six years &mdash; back when the company had twice the drivers. Nobody follows up. The meeting is about
    to move on.</p>
    <button class="choice" onclick="chooseScene4b('A')">
      <span class="tag">Option A</span>
      Stop the meeting and open it up for real. Ask the team to pressure-test the routing themselves &mdash;
      no assumption that six years of habit still makes it right.
    </button>
    <button class="choice" onclick="chooseScene4b('B')">
      <span class="tag">Option B</span>
      Note it for later. There's enough on the plate this week already.
    </button>
  `);
}
function chooseScene4b(opt){
  let consequence;
  if(opt==='A'){
    addScore({stimulation:2});
    consequence = `It takes forty-five minutes nobody had to spare, and two people get a little heated about
      whose route is actually harder. But by Thursday, Danae has sketched a new routing plan that saves real
      time every single day &mdash; something nobody had questioned in six years.`;
    logChoice('Scene 4b: The Question Nobody Asked','Opened the routing question up to the whole team to pressure-test.','Intellectual Stimulation', consequence, 'Forty-five minutes and a genuinely tense meeting, for a payoff that wasn\u2019t guaranteed going in.');
  } else {
    consequence = `The routing question quietly disappears into the same pile as everything else this week.
      Nobody brings it up again &mdash; not because it stopped mattering, but because nobody else felt like it
      was their place to.`;
    logChoice('Scene 4b: The Question Nobody Asked','Tabled the routing question to stay focused on the current priorities.','No strong dimensional signal this time', consequence, 'A real improvement stayed unexamined \u2014 not because anyone decided against it, just because nobody made room for it.');
  }
  showConsequence(consequence, 'scene5');
}
function screenScene5(){
  const lowSupport = state.scores.support <= 1;
  let interrupt = '';
  let optionC = '';
  if(lowSupport){
    interrupt = `<p>Mid-speech, someone interrupts &mdash; openly, in front of everyone: <em>"That's easy to say.
      You weren't the one wondering if you'd make rent."</em> You have to respond in the moment, not deliver
      the message you prepared.</p>`;
    optionC = `
      <button class="choice" onclick="chooseScene5('C')">
        <span class="tag">Option C</span>
        Stop mid-speech. Acknowledge the interruption directly, and ask the room what they actually need before
        continuing. It costs you the polish of the moment &mdash; but it's the only option that repairs trust
        in real time instead of banking it for later.
      </button>`;
  }
  render(`
    <p class="progress">Scene 7 of 10</p>
    <h2>The Vision Reset</h2>
    <p>Numbers are starting to recover. You want to re-articulate where Long Table is headed once this is over
    &mdash; but the team is exhausted, and optimism right now could land as tone-deaf.</p>
    ${interrupt}
    <button class="choice" onclick="chooseScene5('A')">
      <span class="tag">Option A</span>
      Deliver the vision now. Acknowledge the hard months, then paint what's next. Momentum matters, and people
      need something to look forward to.
    </button>
    <button class="choice" onclick="chooseScene5('B')">
      <span class="tag">Option B</span>
      Hold the big moment. Check in one-on-one with people first, and build the vision together later, once
      people have room to hear it.
    </button>
    ${optionC}
  `);
}
function chooseScene5(opt){
  let consequence;
  if(opt==='A'){
    addScore({vision:2});

/* ---------------- HEXAGON DRAWING ---------------- */
const LABEL_LINES = {
  vision: ['Vision'],
  example: ['Leading by', 'Example'],
  group: ['Fostering', 'Group Goals'],
  performance: ['High Performance', 'Expectations'],
  support: ['Individualized', 'Support'],
  stimulation: ['Intellectual', 'Stimulation']
};
function buildHexSVG(scores, size=300){
  const padX = 100, padY = 46;
  const totalW = size + padX*2;
  const totalH = size + padY*2;
  const cx = totalW/2, cy = totalH/2;
  const r = size*0.33;
  const n = DIMENSIONS.length;
  const angle = (i) => (Math.PI/2) + (2*Math.PI*i/n) * -1; // start at top, go clockwise
  const pt = (i, frac) => {
    const a = angle(i);
    return [cx + Math.cos(a)*r*frac, cy - Math.sin(a)*r*frac];
  };
  // grid rings
  let rings = '';
  [0.25,0.5,0.75,1].forEach(frac=>{
    let pts=[];
    for(let i=0;i<n;i++){ pts.push(pt(i,frac).join(',')); }
    rings += `<polygon points="${pts.join(' ')}" fill="none" stroke="rgba(26,21,18,0.18)" stroke-width="1"/>`;
  });
  // axis lines + wrapped labels
  let axes = '', labels='';
  for(let i=0;i<n;i++){
    const [x,y] = pt(i,1);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(26,21,18,0.18)" stroke-width="1"/>`;
    const [lx,ly] = pt(i,1.32);
    const lines = LABEL_LINES[DIMENSIONS[i].key];
    const tspans = lines.map((ln, li) => `<tspan x="${lx}" dy="${li===0 ? 0 : 12}">${ln}</tspan>`).join('');
    const startDy = lines.length > 1 ? -6 : 0;
    labels += `<text x="${lx}" y="${ly}" font-size="11" font-family="Inter, sans-serif" fill="#3a332c"
      text-anchor="middle"><tspan x="${lx}" dy="${startDy}">${lines[0]}</tspan>${lines.slice(1).map(ln=>`<tspan x="${lx}" dy="12">${ln}</tspan>`).join('')}</text>`;
  }
  // data polygon
  let dataPts = [];
  for(let i=0;i<n;i++){
    const key = DIMENSIONS[i].key;
    const frac = Math.max(0, Math.min(1, scores[key]/MAXSCORES[key]));
    dataPts.push(pt(i,frac).join(','));
  }
  const dataPoly = `<polygon points="${dataPts.join(' ')}" fill="rgba(203,32,38,0.28)" stroke="#CB2026" stroke-width="2.5"/>`;
  const dots = dataPts.map(p=>{
    const [x,y]=p.split(',');
    return `<circle cx="${x}" cy="${y}" r="3.5" fill="#CB2026"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}"
    style="max-width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg">
    ${rings}${axes}${dataPoly}${dots}${labels}
  </svg>`;
}

function escapeHtml(s){

}

      <h2 style="color:#CB2026;">Your ending</h2>

      <h2 style="color:#CB2026;">Reflection (after)</h2>
      <p>${escapeHtml(state.predictAfter)}</p>
      <h2 style="color:#CB2026;">Your pattern</h2>
      ${hex}
      <p style="font-size:0.85em;color:#555;">This reflects patterns in the choices made within this fictional
      scenario, not a validated psychological measurement.</p>
